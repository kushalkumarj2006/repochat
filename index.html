<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=2" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AskRepo · codebase Q&A</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- ===== ANIMATED GLASS SCENE (background) ===== -->
  <div class="glass-scene" aria-hidden="true">
    <div class="glass-scene__blob glass-scene__blob--1"></div>
    <div class="glass-scene__blob glass-scene__blob--2"></div>
    <div class="glass-scene__blob glass-scene__blob--3"></div>
    <div class="glass-scene__blob glass-scene__blob--4"></div>
  </div>

  <div class="app">
    <!-- ===== HEADER (glass) ===== -->
    <header class="header glass glass--dark">
      <div class="header-left">
        <button class="hamburger" id="hamburgerBtn" title="Toggle setup panel" aria-label="Toggle setup panel">
          <span class="hamburger__line"></span>
          <span class="hamburger__line"></span>
          <span class="hamburger__line"></span>
        </button>
        <h1>
          AskRepo
          <span class="header-title-small">codebase Q&A</span>
        </h1>
      </div>
      <div class="header-actions">
        <span id="sessionBadge" class="session-badge" style="display:none;"></span>
        <button class="btn btn-danger btn-sm" id="endSessionBtn" style="display:none;">✕ End</button>
      </div>
    </header>

    <!-- ===== SETUP PANEL (glass cards) ===== -->
    <div class="setup-panel" id="setupPanel">
      <div class="setup-grid">
        <!-- Step 1: Ollama -->
        <div class="setup-section glass glass-card glass-card--setup">
          <div class="setup-section__header">
            <span class="step-num" id="step1num">1</span>
            <h3>🧩 Setup Ollama</h3>
          </div>
          <div class="setup-row">
            <button class="btn btn-primary btn-sm" id="startBtn">▶ Start</button>
            <button class="btn btn-danger btn-sm" id="stopBtn" disabled>⏹ Stop</button>
            <span class="cell-status" id="cellStatus">not started</span>
          </div>
          <div class="setup-status" id="setupStatus">⏳ Ready</div>
          <div class="cell-output-preview" id="cellOutput">📋 Output will appear here…</div>
        </div>

        <!-- Step 3: Clone Repository -->
        <div class="setup-section glass glass-card glass-card--setup">
          <div class="setup-section__header">
            <span class="step-num" id="step3num">3</span>
            <h3>📦 Clone Repository</h3>
          </div>
          <div class="setup-row">
            <input type="text" id="repoInput" placeholder="user/repo or URL" value="kushalkumarj2006/repochat" />
            <button class="btn btn-success btn-sm" id="confirmRepoBtn">✅</button>
          </div>
          <div class="repo-display" id="repoDisplay">📁 not set</div>
          <div class="setup-status" id="repoStatus"></div>
        </div>

        <!-- Step 4: Index & Ready -->
        <div class="setup-section glass glass-card glass-card--setup" style="grid-column: 1 / -1;">
          <div class="setup-section__header">
            <span class="step-num" id="step4num">4</span>
            <h3>🚀 Index &amp; Ready — <span style="color:var(--accent-aqua);">RAG + Qwen3-Coder-14B</span></h3>
          </div>
          <div class="setup-row">
            <span class="index-status" id="indexStatus">⏳ waiting</span>
            <span class="file-stats" id="fileStats">📄 0 files</span>
            <span class="file-stats" style="color:var(--accent-violet);">🧠 hybrid retrieval</span>
          </div>
        </div>
      </div>
    </div>

    <!-- ===== CHAT AREA ===== -->
    <div class="chat-container">
      <div class="chat-messages" id="chatMessages">
        <div class="empty glass glass--frosted">🤖 Ask a question after setup completes.</div>
      </div>

      <div class="chat-input-area glass glass--dark">
        <div class="chat-input-row">
          <input type="text" id="questionInput" placeholder="Ask about the codebase…" disabled />
          <div class="chat-btn-group">
            <button class="btn btn-primary" id="askFastBtn" disabled>⚡ fast</button>
            <button class="btn btn-secondary" id="askSimpleBtn" disabled>💬 simple</button>
          </div>
        </div>
        <div class="chat-status" id="chatStatus">⏳ Setup required</div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
